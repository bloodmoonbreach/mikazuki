[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikazuki"
version = "0.2.0"
description = "Self-hosted web UI for cvtracks (CVs from one master file) and remote-check (where can this remote job be done from?)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "bloodmoonbreach" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "cvtracks[pdf]",
  "remote-eligibility",
  "job-feed",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mikazuki = "mikazuki.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mikazuki = ["templates/*.html", "static/*", "static/fonts/*", "packs/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
