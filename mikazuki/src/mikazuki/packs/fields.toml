# Words that rule a job out by title, by the experience level you pick in the wizard.
[exclude.entry]
words = ["senior", "sr", "lead", "principal", "staff", "head", "director", "manager", "architect", "vp", "chief",
         "jefe", "responsable", "líder", "coordinador", "sef", "coordonator", "intern", "internship", "becario",
         "practicas", "stagiu", "trainee"]
[exclude.mid]
words = ["principal", "staff", "head", "director", "vp", "chief", "intern", "internship", "becario", "practicas",
         "stagiu", "junior", "trainee"]
[exclude.senior]
words = ["intern", "internship", "becario", "practicas", "stagiu", "junior", "trainee", "graduate"]
