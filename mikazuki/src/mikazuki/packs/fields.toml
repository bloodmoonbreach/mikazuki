# Field presets for the setup wizard. Each preset offers roles; each chosen role becomes a CV track and a
# feed search. Keywords are matched in job titles (case- and accent-insensitive), so list the words
# employers really use, in every language of your job market. Pull requests with more languages welcome.

[[preset]]
id = "it-security"
name = "Cybersecurity and IT support"
blurb = "Security analyst, SOC, help desk, systems and network administration."
skills = "it-security"
sources = ["cybersecurityjobsite"]

  [[preset.role]]
  id = "security"
  title = {en = "Security Analyst", es = "Analista de ciberseguridad", ro = "Analist securitate cibernetică"}
  keywords = ["security analyst", "SOC analyst", "SOC", "cybersecurity", "cyber security", "information security",
              "security engineer", "incident response", "threat", "pentester", "penetration tester", "blue team",
              "ciberseguridad", "analista de seguridad", "seguridad informática", "securitate cibernetica",
              "analist securitate", "securitate IT"]
  workday = ["security", "cyber"]

  [[preset.role]]
  id = "support"
  title = {en = "IT Support Technician", es = "Técnico de soporte IT", ro = "Tehnician suport IT"}
  keywords = ["help desk", "helpdesk", "service desk", "IT support", "technical support", "desktop support",
              "support technician", "support engineer", "soporte técnico", "técnico de soporte", "técnico informático",
              "microinformática", "suport tehnic", "suport IT", "tehnician IT"]
  workday = ["help desk", "service desk", "IT support"]

  [[preset.role]]
  id = "sysadmin"
  title = {en = "Systems Administrator", es = "Administrador de sistemas", ro = "Administrator de sistem"}
  keywords = ["system administrator", "systems administrator", "sysadmin", "network administrator",
              "network engineer", "infrastructure engineer", "administrador de sistemas", "administrador de redes",
              "técnico de sistemas", "administrator de sistem", "administrator retea", "inginer de retea"]
  workday = ["system administrator", "network"]

