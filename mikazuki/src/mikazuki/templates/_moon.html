{# Keyword fit drawn as a waxing moon: 0% new moon, 50% half, 100% full. The lit part grows from the right. #}
{% macro moon(fit, size=28) -%}
{%- set p = [[(fit or 0) / 100, 0]|max, 1]|min -%}
{%- set rx = (10 * (1 - 2 * p))|abs -%}
<span class="moon" title="Keyword fit {{ fit }}%">
  <svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" aria-hidden="true" focusable="false">
    <circle class="moon-dark" cx="12" cy="12" r="10"/>
    {%- if p >= 0.995 %}<circle class="moon-lit" cx="12" cy="12" r="10"/>
    {%- elif p > 0.005 %}<path class="moon-lit" d="M12 2 A10 10 0 0 1 12 22 A{{ '%.2f'|format(rx) }} 10 0 0 {{ 1 if p > 0.5 else 0 }} 12 2 Z"/>{% endif %}
  </svg>
  <span class="moon-pct">{{ fit }}%</span>
</span>
{%- endmacro %}
