<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · mikazuki</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
<main class="login">
  <div class="login-card">
    <svg class="login-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.4 2.6a9.6 9.6 0 1 0 5.4 17.3A8 8 0 1 1 15.4 2.6z"/></svg>
    <h1 class="login-brand">mikazuki</h1>
    <p class="muted">Your job feed, CVs and applications.</p>
    {% if error %}<p class="note bad" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Username <input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" value="{{ user }}" required {% if not user %}autofocus{% endif %}></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required {% if user %}autofocus{% endif %}></label>
      <label class="check"><input type="checkbox" name="remember" value="1" checked> Keep me signed in for 30 days</label>
      <button class="wide">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
